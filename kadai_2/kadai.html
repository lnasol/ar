<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Character Animation</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
</head>

<body>
    <style>
        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 999;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            max-width: 95vw;
        }
        select {
            font-size: 16px;
            padding: 8px 10px;
            border-radius: 8px;
            background-color: white;
            border: 1px solid #ccc;
        }
        button {
            font-size: 16px;
            padding: 8px 12px;
            border-radius: 8px;
            background-color: royalblue;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
    <div id="hud">
        <select id="animationSelect">
            <option value="CharacterArmature|Idle">待機</option>
            <option value="CharacterArmature|Walk">あるく</option>
            <option value="CharacterArmature|Run">走る</option>
            <option value="CharacterArmature|Attack">攻撃</option>
            <option value="CharacterArmature|Shoot">シュート</option>
            <option value="CharacterArmature|Dead">倒れる</option>
        </select>
        <button id="enlargeButton">拡大</button>
        <button id="shrinkButton">縮小</button>
        <button id="rotateButton">回転</button>
        <button id="reverseRotateButton">逆回転</button>
    </div>

    <a-scene embedded arjs="sourceType: webcam">
        <a-marker preset="hiro" smooth="true">
            <a-entity id="model" position="0 0 0.1" scale="1 1 1" rotation="0 0 0">
                <a-gltf-model id="robot" src="wa.glb" position="0 0 0" scale="0.3 0.3 0.3" rotation="-90 0 0"
                    animation-mixer="clip: CharacterArmature|Idle">
                </a-gltf-model>
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const robot = document.getElementById("robot");
        const animationSelect = document.getElementById("animationSelect");
        const model = document.getElementById("model");
        
        const enlargeButton = document.getElementById("enlargeButton");
        const shrinkButton = document.getElementById("shrinkButton");
        const rotateButton = document.getElementById("rotateButton");
        const reverseRotateButton = document.getElementById("reverseRotateButton");

        let scaleSize = 1;
        let rotY = 0;

        function enlargeModel() {
            scaleSize += 0.1;
            model.setAttribute("scale", `${scaleSize} ${scaleSize} ${scaleSize}`);
        }
        enlargeButton.addEventListener("click", enlargeModel);

        function shrinkModel() {
            if (scaleSize > 0.2) {
                scaleSize -= 0.1;
                model.setAttribute("scale", `${scaleSize} ${scaleSize} ${scaleSize}`);
            }
        }
        shrinkButton.addEventListener("click", shrinkModel);

        function rotateModel() {
            rotY = (rotY + 45) % 360;
            model.setAttribute("rotation", `0 ${rotY} 0`);
        }
        rotateButton.addEventListener("click", rotateModel);

        function reverseRotateModel() {
            rotY = (rotY - 45 + 360) % 360;
            model.setAttribute("rotation", `0 ${rotY} 0`);
        }
        reverseRotateButton.addEventListener("click", reverseRotateModel);

        function changeAnimation() {
            robot.setAttribute("animation-mixer", "clip", animationSelect.value);
        }
        animationSelect.addEventListener("change", changeAnimation);
    </script>
</body>
</html>
